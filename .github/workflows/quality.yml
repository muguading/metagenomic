name: Quality

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PORTAL_MODE: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements-web.txt
            requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-web.txt -r requirements-dev.txt
      - name: Compile Python sources
        run: python -m compileall -q bac_analysis_portal metagenomic_refactor tests
      - name: Check fatal Python errors
        run: python -m ruff check --select E9,F63,F7,F82 bac_analysis_portal metagenomic_refactor tests
      - name: Check workbench ES modules
        run: |
          node --input-type=module --check < bac_analysis_portal/static/app.js
          find bac_analysis_portal/static/workbench -name "*.js" -print0 |
            while IFS= read -r -d "" file; do
              node --input-type=module --check < "$file"
            done
      - name: Run tests
        run: python -m pytest tests -q
